# Ose Demander : service des liens courts. Publié sur workers.dev (le site reste sur GitHub Pages, DNS inchangés).
# AUCUN SECRET ICI (dépôt public) : la publication se fait après « npx wrangler login », depuis l'ordinateur.
name = "ose-liens"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Aucun journal : ni journaux de requêtes, ni traces
[observability]
enabled = false

[vars]
# Seul le site peut appeler le Worker depuis un navigateur (CORS)
ORIGINES = "https://osedemander.fr"
# Clé publique VAPID des notifications de réponse (publique : elle est aussi dans index.html). La clé privée et la clé de
# stockage des abonnements sont des secrets Cloudflare (wrangler secret put VAPID_PRIVEE / CLE_STOCKAGE), jamais dans le dépôt.
VAPID_PUBLIQUE = "BO0i81U9evIx9nmwltbUyZLH_p_hXXYadDPHRzamX3YeVApCHX8hZ8BiaYNyzK3uDGoLBYx_ChWYaONznnoakTI"

[[d1_databases]]
binding = "DB"
database_name = "ose-liens"
database_id = "80b6666a-abf9-4c89-bf1f-74e0c8c91ce4"

# Nettoyage quotidien des liens expirés (3 h 17 UTC)
[triggers]
crons = ["17 3 * * *"]

# Limites par adresse IP, comptées en mémoire par Cloudflare (aucune adresse enregistrée)
[[ratelimits]]
name = "LIMITE_CREATION"
namespace_id = "2701"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIMITE_LECTURE"
namespace_id = "2702"
simple = { limit = 120, period = 60 }

# Notifications de réponse : abonnements et envois, 10 par minute et par adresse IP chacun
[[ratelimits]]
name = "LIMITE_ABO"
namespace_id = "2703"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIMITE_ENVOI"
namespace_id = "2704"
simple = { limit = 10, period = 60 }
