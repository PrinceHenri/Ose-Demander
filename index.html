};
// Zones permises (r : rayon de la forme) : corps = sous les plis, hors du cachet, débord léger ; rabat = dans le triangle, hors du cachet
const emFold = x => 2+116*Math.min(x-2, 298-x)/148, emFlapY = x => 2+112*Math.min(x-2, 298-x)/148;
const emNoSeal = (x, y, r) => Math.hypot(x-150, y-110) > 47+r;
const EM_IN = {
  body: (x, y, r) => y-r > Math.max(emFold(x-r), emFold(x+r))+3 && emNoSeal(x, y, r) && x-r > -8 && x+r < 308 && y+r < 207,
  flap: (x, y, r) => y-r > 4 && y+r*1.2 < Math.min(emFlapY(x-r), emFlapY(x+r)) && emNoSeal(x, y, r)
};
/* Bouquet partant d'un coin, comme un cadre illustré : n formes tirées avec une graine fixe (même dessin à chaque ouverture), dans l'angle
   a0..a1 (degrés) depuis le coin (cx, cy), grandes près du coin et plus petites vers l'intérieur, tournées vers l'extérieur, sans trop se
   recouvrir, gardées dans la zone permise ; shapes : noms de EM_SH ; cls : classes de remplissage, tour à tour */
function emSpray(seed, n, cx, cy, a0, a1, R, part, shapes, cls=["em-s","em-h","em-b"], k=part==="body" ? 1.3 : 1){
  const rnd=imgRand(seed), mis=[]; let out="";
  for(let i=0, essai=0; i<n && essai<n*60; essai++){
    const a=(a0+(a1-a0)*rnd())*Math.PI/180, d=R*(.12+.88*rnd()), x=cx+d*Math.cos(a), y=cy+d*Math.sin(a), s=k*(1.9-1.05*d/R), r=10*s;
    if(!EM_IN[part](x, y, r) || mis.some(([u, v, q])=>Math.hypot(u-x, v-y) < 1.1*(q+r))) continue;
    const sh=shapes[i%shapes.length], rot=/leaf|petal/.test(sh) ? a*180/Math.PI+(rnd()-.5)*50 : (rnd()-.5)*40;
    out+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot|0}) scale(${s.toFixed(2)})">${EM_SH[sh](cls[i%cls.length])}</g>`; mis.push([x, y, r]); i++;
  }
  return out;
}

/* Motif du rabat ou du corps ("flap" / "body"), ou "" (occasion décorée, thème sans motif) ; lv : niveau d'animation de l'invitation */
function envMotifHTML(part, th, occ, lv){
  const m = !ENV_DECO[occ] && ENVELOPE_MOTIFS[th||"base"];
  return m ? `<g class="em em-${part} em-${lv}" aria-hidden="true">${m[part]}</g>` : "";
}

  setTheme(D.th||"base", invAnim(), D.ac, true);
  document.title = `${D.f} a une question pour toi`;

  $("#app").innerHTML = `
  <main class="env-screen">
    ${soundBtn()}${demoBanner()}${sceneSignHTML()}
    <p class="env-from" tabindex="-1">${esc(D.f)} t'a envoyé une invitation</p>
    <button type="button" class="envelope ${invAnim()==="n"?"wiggle":invAnim()==="d"?"beat-d":""}" id="env" aria-label="Ouvrir l'invitation">
      <span class="env-back"></span>
      <span class="env-paper">Pour ${esc(D.t)}</span>
      <svg class="env-front" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 2 L150 118 L298 2 L298 188 Q298 198 288 198 L12 198 Q2 198 2 188 Z" style="fill:var(--accent)" />
        <path d="M2 2 L150 118 L298 2 L298 188 Q298 198 288 198 L12 198 Q2 198 2 188 Z" fill="rgba(0,0,0,.08)" style="stroke:var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M4 196 L122 96 M296 196 L178 96" style="stroke:var(--ink)" stroke-width="1.5" opacity=".3"/>
        ${envMotifHTML("body", D.th, envDecoOcc(D.o, D.th), invAnim())}
      </svg>

        ${envMotifHTML("flap", D.th, envDecoOcc(D.o, D.th), invAnim())}

      ${envDecoHTML(envDecoOcc(D.o, D.th), invAnim())}

  bindSound();

    $("#env").classList.add("open"); $(".env-screen").classList.add("opened"); Sound.init(); Sound.pop(); buzz(20);
    setTimeout(D.ix ? renderIntro : renderInvite, invAnim()==="0" ? 0 : 1150); // introduction éventuelle, puis la question
  });
  focusScreen(".env-from");
}

/* Introduction scénarisée : les cartes de LINK_INTRO, l'une après l'autre, avant la question.
   Toujours passable ; le délai du vrai refus ne démarre qu'à la question (renderInvite). */
let introIdx=0;
const introText = t => esc(t).replaceAll("{pour}", esc(D.t));
function renderIntro(){
  const cards=LINK_INTRO[D.ix], anim=invAnim();
  setTheme(D.th||"base", anim, D.ac, true);
  document.title = `${D.f} a une question pour toi`;
  introIdx=0;
  $("#app").innerHTML = `
  <main class="intro-screen anim-${anim}">
    ${soundBtn()}${demoBanner()}${sceneSignHTML()}
    <p class="intro-from">De la part de ${esc(D.f)}</p>
    <div class="intro-deck" id="deck">${cards.map((t,i)=>`<div class="intro-card${i?" under":""}" data-card="${i}"${i?' aria-hidden="true"':""}>
      <h1 class="intro-text"${i?"":' tabindex="-1"'}>${introText(t)}</h1></div>`).join("")}</div>
    <p class="intro-dots" aria-hidden="true">${cards.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</p>
    <p class="sr" id="introPos" aria-live="polite">Carte 1 sur ${cards.length}</p>
    <div class="intro-btns">
      <button type="button" class="btn primary" id="introNext">${cards.length>1 ? "La suite" : "Voir la question"}</button>
      <button type="button" class="btn ghost intro-skip" id="introSkip" aria-label="Passer l'introduction">Passer</button>
    </div>
    <p class="safety">${SAFETY}</p>
  </main>`;
  bindSound();
  $("#introNext").addEventListener("click", introNext);
  $("#deck").addEventListener("click", introNext);
  $("#introSkip").addEventListener("click", ()=>{ Sound.pop(); renderInvite(); });
  focusScreen(".intro-text");
}
function introNext(){
  const cards=LINK_INTRO[D.ix];
  if(!$("#deck")) return;
  if(introIdx>=cards.length-1){ Sound.pop(); renderInvite(); return; }
  const top=$(`.intro-card[data-card="${introIdx}"]`), nx=$(`.intro-card[data-card="${++introIdx}"]`);
  Sound.card(); buzz(10);
  if(invAnim()==="0") top.remove();
  else { top.classList.add("gone"); top.setAttribute("aria-hidden","true"); setTimeout(()=>top.remove(), 520); }
  nx.classList.remove("under"); nx.removeAttribute("aria-hidden");
  $$(".intro-dots i").forEach((d,i)=>d.classList.toggle("on", i===introIdx));
  const last=introIdx===cards.length-1;
  $("#introPos").textContent=`Carte ${introIdx+1} sur ${cards.length} : ${cards[introIdx].replaceAll("{pour}", D.t)}`;
  if(last){ $("#introNext").textContent="Voir la question"; $("#introSkip").style.visibility="hidden"; } // « Passer » ferait doublon (place gardée : rien ne saute)
}

function enableTilt(){
  window.onmousemove=null;
  if(invAnim()!=="n" || !matchMedia("(pointer:fine)").matches) return;
  window.onmousemove=e=>{
    const tk=$(".ticket"); if(!tk) return;
    const rx=(e.clientY/innerHeight-.5)*-7, ry=(e.clientX/innerWidth-.5)*7;
    tk.style.transform=`perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
  };
}

const signHTML = () => D.sg ? `<p class="sign">${esc(D.sg)}</p>` : "";
const invOccLabel = () => D.o==="libre" ? (D.of||"") : (OCC[D.o]?.label||"");
function ticketHTML(inner){
  return `
  ${soundBtn()}${demoBanner()}
  <main class="inv">
    ${sceneSignHTML()}
    <div class="ticket pop-in">
      <div class="stub"><div>De<b>${esc(D.f)}</b></div><div style="text-align:right">Pour<b>${esc(D.t)}</b></div></div>
      <div class="perf" aria-hidden="true"></div>
      <div class="main" id="main">${inner}</div>
    </div>
    <p class="foot"><span class="safety">${SAFETY}</span><br>Invitation créée avec Ose Demander.<br><a href="./">Crée la tienne</a> · <a href="mentions-legales.html#signaler">Signaler un abus</a></p>
  </main>`;
}
function renderInvite(){
  setTheme(D.th||"base", invAnim(), D.ac, true);
  refused=false;
  const occ = invOccLabel();
  document.title = `${D.f} a une question pour toi`;
  $("#app").innerHTML = ticketHTML(`
        ${occ?`<p class="occ">${esc(occ)}</p>`:""}
        <h1 class="question" tabindex="-1">${esc(D.q)}</h1>
        ${D.m && !D.mh ? `<p class="handnote" style="margin:-8px 0 22px">${esc(D.m)}</p>` : ""}
        <div class="answer" id="answer">
          <button class="yes" id="yes" type="button">Oui</button>
          <button class="no" id="no" type="button">Non</button>
        </div>
        <p class="tease" id="tease" aria-live="polite"></p>
        <p class="refuse-slot" id="refuseSlot"></p>
        ${signHTML()}`);
  bindSound();
  bindNo();
  $("#yes").addEventListener("click", sayYes);
  enableTilt();
  clearTimeout(refuseTimer);
  if(noTries>=REFUSE_TRIES || refuseOffered) showRefuseLink();
  else refuseTimer=setTimeout(showRefuseLink, REFUSE_DELAY);
  focusScreen(".question");
}
/* Le lien discret « Répondre non, pour de vrai » */
function showRefuseLink(){
  const slot=$("#refuseSlot");
  if(!slot || yesDone || refused || slot.firstChild) return;
  refuseOffered=true; clearTimeout(refuseTimer);
  slot.innerHTML=`<button type="button" class="refuse" id="refuse">Répondre non, pour de vrai</button>`;
  $("#refuse").addEventListener("click", openRefuse);
}
/* Réponses proposées pour le vrai refus : claires, sans ouverture ambiguë, neutres.
   Chaque texte reste modifiable avant l'envoi (200 caractères max). Rien n'est mis dans le lien. */
const REFUSE_MAX=200;
const REFUSE_CHOICES=[
  {id:"non", label:"Non merci"},
  {id:"date", label:"Pas disponible"},
  {id:"libre", label:"Écrire ma réponse"}
];
function refuseDefault(why, from, multi){
  if(why==="non") return `Merci pour ton invitation, ${from}. Ma réponse est non, mais merci d'avoir osé demander 💛`;
  if(why==="date") return `Merci pour ton invitation, ${from} 💛 Je ne suis pas disponible ${multi?"à ces dates":"à cette date"}.`;
  return "";
}
let refuseDrafts={}; // textes modifiés, par choix, tant que la page est ouverte
const refuseText = () => (refuseDrafts[refuseWhy] ?? refuseDefault(refuseWhy, D.f, !!D.sl)).slice(0,REFUSE_MAX);
function openRefuse(){
  if(yesDone) return;
  refused=true; clearTimeout(refuseTimer);
  $$(".no.flee").forEach(b=>b.remove());
  const main=$("#main");
  main.innerHTML = `
    <div class="pop-in">
      <h1 class="question" tabindex="-1" style="margin-bottom:8px">Répondre non</h1>
      <p style="color:var(--muted);margin:0 0 16px">Pas de souci, ${esc(D.f)} comprendra.</p>
      <div class="chips" role="group" aria-label="Ta réponse" style="justify-content:center">
        ${REFUSE_CHOICES.map(c=>`<button type="button" class="chip" data-why="${c.id}" aria-pressed="${refuseWhy===c.id}">${c.label}</button>`).join("")}
      </div>
      <label class="field refuse-field"><span>Ta réponse <em>(modifiable avant l'envoi)</em></span>
        <textarea class="input refuse-input" id="refuseText" maxlength="${REFUSE_MAX}" placeholder="Écris ta réponse…">${esc(refuseText())}</textarea>
        <div class="counter" id="refuseCnt">${refuseText().length} / ${REFUSE_MAX}</div></label>
      <div class="after-actions">

        ${D.nz && !EXAMPLE ? `<div class="notif-box" id="notifBox">${notifBtnHTML("n")}</div>` : ""}
        <button type="button" class="refuse" id="undoNo">Finalement, je reviens en arrière</button>
      </div>
      ${signHTML()}
    </div>`;
  const ta=$("#refuseText"), cnt=$("#refuseCnt");
  const current=()=>ta.value.slice(0,REFUSE_MAX).trim();
  ta.addEventListener("input",()=>{ refuseDrafts[refuseWhy]=ta.value; cnt.textContent=`${ta.value.length} / ${REFUSE_MAX}`; });
  $$("[data-why]",main).forEach(b=>b.addEventListener("click",()=>{
    refuseWhy=b.dataset.why;
    $$("[data-why]",main).forEach(x=>x.setAttribute("aria-pressed", x===b));
    ta.value=refuseText(); cnt.textContent=`${ta.value.length} / ${REFUSE_MAX}`;
    if(refuseWhy==="libre") ta.focus();
  }));
  const withText=fn=>()=>{ const t=current(); if(!t){ toast("Écris d'abord ta réponse"); ta.focus(); return; } fn(t); };
  $("#replyNo").addEventListener("click",withText(t=>sendReply(t)));
  $("#copyNo").addEventListener("click",withText(async t=>toast(await copyText(t)?"Réponse copiée":"Copie impossible")));
  $("#notifR")?.addEventListener("click",()=>notifyReply("n"));
  $("#undoNo").addEventListener("click",renderInvite);
  $("#replyNo").focus();
}

function bindNo(){
  const no=$("#no"), yes=$("#yes"), tease=$("#tease");
  let n=0;
  const tone=noTone(D.tn), lines=tone.lines;
  let last=0;
  // Chaque tentative sur le Non compte (une seule fois par geste)
  const hit=()=>{ const now=Date.now(); if(now-last<250) return; last=now; Decor.react(); Sound.no(); buzz(25);
    if(++noTries>=REFUSE_TRIES) showRefuseLink(); };
  const say=()=>{ tease.textContent=lines[Math.min(n,lines.length-1)]; n++; hit(); };
  if(D.n==="fuit"){
    const flee=e=>{
      if(e) e.preventDefault();
      const r=no.getBoundingClientRect(), yr=yes.getBoundingClientRect(), rf=$("#refuse")?.getBoundingClientRect();
      const W=window.innerWidth, H=window.innerHeight, m=16;
      // Le Non ne se pose jamais sur le Oui ni sur le vrai refus (qui doit rester facile à toucher)
      const covers=(b,x,y)=>b && x<b.right+20 && x+r.width>b.left-20 && y<b.bottom+20 && y+r.height>b.top-20;
      let x,y,tries=0;
      do{ x=m+Math.random()*(W-r.width-2*m); y=m+Math.random()*(H-r.height-2*m); tries++; }
      while(tries<30 && (Math.abs(x-r.left)<90 && Math.abs(y-r.top)<60 || covers(yr,x,y) || covers(rf,x,y)));
      if(!no.classList.contains("flee")){ document.body.appendChild(no); no.style.left=r.left+"px"; no.style.top=r.top+"px"; no.classList.add("flee"); no.offsetHeight; }
      no.style.left=x+"px"; no.style.top=y+"px"; say();
    };
    no.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse") flee(); });
    no.addEventListener("touchstart",flee,{passive:false});
    no.addEventListener("click",flee);
  } else if(D.n==="retrecit"){
    let s=1, ys=1;
    no.addEventListener("click",()=>{
      s=Math.max(s*.78,.35); ys=Math.min(ys*1.15,1.9);
      no.style.transform=`scale(${s})`; yes.style.transform=`scale(${ys})`;
      if(s<=.35){ tease.textContent=tone.small; hit(); } else say();
    });
  } else if(D.n==="supplie"){
    const beg=tone.beg;
    let i=0;
    no.addEventListener("click",()=>{
      if(i<beg.length){ no.textContent=beg[i++]; tease.textContent=""; hit(); }
      else if(i===beg.length){ no.textContent=tone.giveUp; i++; hit(); }
      else openRefuse(); // il a supplié, il accepte le refus
    });
  } else { // transforme : il tente « Oui ? », mais ne dit jamais oui à ta place
    const turn=()=>{ if(no.textContent==="Non"){ no.textContent="Oui ?"; hit(); } };
    const back=()=>{ no.textContent="Non"; };
    no.addEventListener("pointerenter",turn); no.addEventListener("focus",turn);
    no.addEventListener("pointerleave",back); no.addEventListener("blur",back);
    no.addEventListener("click",()=>{ turn(); tease.textContent=tone.turn; hit(); });
  }
}

function sayYes(e){
  if(yesDone || refused) return;
  clearTimeout(refuseTimer);
  let x=innerWidth/2, y=innerHeight*.5;
  const src=e && e.currentTarget && e.currentTarget.getBoundingClientRect ? e.currentTarget : $("#yes");
  if(src){ const r=src.getBoundingClientRect(); x=r.left+r.width/2; y=r.top+r.height/2; }
  $$(".no.flee").forEach(b=>b.remove());
  yesDone=true;

/* ---------- Révélation programmée ----------
   Ce qui est déjà affiché en clair est gardé en mémoire le temps de la page seulement : rien n'est enregistré. */
let revShown=new Set(), revQueue=[], revPlaying=false, revStart=null;
function initReveals(){ revQueue=[]; revShown=new Set(revealPlan(D, Date.now(), invAnim()).shown); }
function revealable(at){ return at && new Date(at) <= new Date(); }
function countdown(at){
  let s=Math.max(0,Math.floor((new Date(at)-new Date())/1000));
  const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  return (d?d+" j ":"")+String(h).padStart(2,"0")+" h "+String(m).padStart(2,"0")+" min "+String(s).padStart(2,"0")+" s";
}
function mapsLink(place){ return `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}" target="_blank" rel="noopener">${esc(place)}</a><br><small>Voir sur la carte</small>`; }
function lockedHTML(label, hint, at){
  return `<div class="locked"><span class="lk" aria-hidden="true">🔒</span><div><strong>${label}</strong>
    ${hint?`<small>Indice : ${esc(hint)}</small>`:""}
    ${at && !revealable(at)?`<small>Se révèle dans <span class="count" data-at="${esc(at)}">${countdown(at)}</span></small>`:""}</div></div>`;
}
// Une révélation n'est affichée en clair qu'une fois l'heure atteinte ET sa mise en scène jouée (ou sautée)
const isOpen = (at, key) => revealable(at) && revShown.has(key);
function itemHTML(it, kind, key){
  if(!it) return "";
  if(it.v==="v") return kind==="lieu" ? mapsLink(it.x) : `<strong>${esc(it.x)}</strong>`;
  if(it.v==="r" && isOpen(it.at, key)){ let val=""; try{ val=unscramble(it.e); }catch(e){} if(val) return kind==="lieu" ? mapsLink(val) : `<strong>${esc(val)}</strong>`; }
  return lockedHTML("Surprise", it.h, it.v==="r"?it.at:null);
}
const rowHTML = key => key==="a"
  ? `<div class="d-row" data-rk="a"><small>Au programme</small>${itemHTML(D.a,"act","a")}</div>`
  : `<div class="d-row" data-rk="l"><small>Où</small>${itemHTML(D.l,"lieu","l")}</div>`;
function stepHTML(st, i){
  const key="p"+i; let body, lock=false;
  if(st.v==="v") body=`<strong>${esc(st.a)}</strong>${st.l?`<br>${mapsLink(st.l)}`:""}`;
  else if(st.v==="r" && isOpen(st.at, key) && (()=>{ try{ const x=JSON.parse(unscramble(st.e)); st._a=String(x.a||"").slice(0,80); st._l=String(x.l||"").slice(0,120); return true; }catch(e){ return false; } })()){ body=`<strong>${esc(st._a)}</strong>${st._l?`<br>${mapsLink(st._l)}`:""}`; }
  else { lock=true; body=lockedHTML("Surprise", st.i, st.v==="r"?st.at:null); }
  return `<li class="${lock?"lock":""}" data-rk="${key}"><div class="h">${esc(st.h||"")}</div>${body}</li>`;
}
/* Remplace un élément par son contenu à jour ; renvoie le nouvel élément */
function swapReveal(key){
  const el=$(`[data-rk="${key}"]`); if(!el) return null;
  el.outerHTML = key[0]==="p" ? stepHTML(D.p[+key.slice(1)], +key.slice(1)) : rowHTML(key);
  return $(`[data-rk="${key}"]`);
}
/* Heure atteinte : mise en scène (ou affichage direct si les animations sont coupées) */
function checkReveals(){
  if(!D || !$("#details")) return;
  const now=Date.now(), direct=invAnim()==="0";
  let due=false;
  for(const [key,at] of revealKeys(D)){
    if(revShown.has(key) || revQueue.includes(key) || new Date(at).getTime()>now) continue;
    due=true;
    if(direct){ revShown.add(key); swapReveal(key); }
    else revQueue.push(key);
  }
  // Une révélation vient d'arriver : son rappel d'agenda n'a plus lieu d'être
  const a=$("#actions"); if(due && a && $("#calRev",a)){ a.innerHTML=actionsHTML(); bindActions(); }
  playReveals();
}
/* Les surprises se révèlent l'une après l'autre : le cadenas tremble, s'ouvre, petite explosion, son, surlignage */
async function playReveals(){
  if(revPlaying) return; revPlaying=true;
  const wait=ms=>new Promise(r=>setTimeout(r,ms)), soft=invAnim()==="d";
  try{
    while(revQueue.length){
      const key=revQueue[0];
      let el=$(`[data-rk="${key}"]`);
      if(!el){ revQueue.shift(); revShown.add(key); continue; }
      el.scrollIntoView({block:"center", behavior:"smooth"});
      await wait(450);
      let lk=$(`[data-rk="${key}"] .lk`), x=innerWidth/2, y=innerHeight/2;
      if(lk){
        lk.classList.add("shake"); buzz(15);
        await wait(soft ? 420 : 760);
        lk=$(`[data-rk="${key}"] .lk`);
        if(lk){ lk.classList.remove("shake"); lk.classList.add("open"); lk.textContent="🔓"; const r=lk.getBoundingClientRect(); x=r.left+r.width/2; y=r.top+r.height/2; }
        await wait(260);
      }
      if(revQueue[0]!==key) continue; // une autre invitation a été ouverte entre-temps
      revQueue.shift(); revShown.add(key);
      Decor.burst(x, y, soft ? 24 : 50, true); Sound.reveal(); buzz([20,40,30]);
      swapReveal(key)?.classList.add("rv-flash");
      await wait(soft ? 700 : 1150);
    }
  } finally { revPlaying=false; }
}
function whenText(){

/* « Me prévenir quand la surprise se révèle » : après le Oui seulement (ni dans le rappel d'agenda, qui a ses alertes, ni dans la version
   partagée, qui n'a plus de révélation), s'il reste une révélation à venir et une fois le lien de rappel prêt (c'est lui qui sera rouvert).
   iPhone hors de l'appli installée, navigateur intégré, navigateur sans notifications : pas de case, le rappel d'agenda à la place. */
let revNotif={etat:"", inv:""}; // etat : "" (pas encore vérifié) | "off" | "actif" | "attente" | "refuse" | "reseau"
const revealNotifOk = () => afterMode==="yes" && !EXAMPLE && !D.vu && !D.rv && revealTimes(D).length>0;

function revealNotifHTML(){

  const note = bloque ? "Les notifications sont bloquées pour ce site. Autorise-les dans les réglages de ton navigateur, ou ajoute un rappel à ton agenda."
    : revNotif.etat==="actif" ? `🔔 C'est noté : une notification à l'heure ${many?"de chaque révélation":"de la révélation"}, sans rien dévoiler.`
    : revNotif.etat==="refuse" ? "Notifications non autorisées : ajoute plutôt un rappel à ton agenda."
    : revNotif.etat==="reseau" ? "La notification n'a pas pu être programmée. Réessaie, ou ajoute un rappel à ton agenda."
    : `Une notification à l'heure ${many?"de chaque révélation":"de la révélation"}, sans rien dévoiler.`;
  return `<div class="rev-notif"><label class="check"><input type="checkbox" id="revNotif" ${on?"checked":""} ${bloque||revNotif.etat==="attente"?"disabled":""}>

/* Une fois le lien de rappel prêt : abonnement déjà pris sur cet appareil ? Sinon, case cochée d'office (et abonnement) seulement si
   l'autorisation a déjà été accordée. */
async function syncRevealNotif(){
  if(!revealNotifOk() || revealAgendaOnly() || !remLink){ revNotif={etat:"", inv:""}; return; }
  const slot=chosenSlot, inv=await revealInv(D, slot);
  let mine=[]; try{ mine=(await notifStore("revelations","readonly",st=>st.getAll())).filter(x=>x.inv===inv && x.heure>Date.now()); }catch(e){}
  if(slot!==chosenSlot) return;
  revNotif={etat: mine.length ? "actif" : "off", inv};
  if(!mine.length && notifSupport()==="ok" && Notification.permission==="granted") await setRevealNotif(true, false);

/* Cocher ou décocher. ask : demander l'autorisation (pendant le toucher, comme l'exige Safari) */
async function setRevealNotif(on, ask=true){
  const inv=revNotif.inv;
  if(!on){ revNotif={etat:"off", inv}; refreshActions(); await cancelReveal(inv); return; }
  const perm = Notification.permission==="granted" ? "granted" : ask ? await Promise.resolve(Notification.requestPermission()).catch(()=>"denied") : "default";
  if(perm!=="granted"){ revNotif={etat: perm==="denied" ? "refuse" : "off", inv}; refreshActions(); return; }
  revNotif={etat:"attente", inv}; refreshActions();
  let r="reseau"; try{ const abo=await pushAbo(); if(abo) r=await scheduleReveal(abo, revealTimes(D), remLink, inv); }catch(e){}
  revNotif={etat: r==="ok" ? "actif" : "reseau", inv}; refreshActions();
  if(r==="ok") buzz(15);
}

/* « Partager la surprise » : bouton secondaire, si le créateur l'autorise (D.pa) et une fois le lien allégé prêt */
const shareHTML = () => `<button type="button" class="btn" id="shareSur">Partager la surprise</button>
  <p class="cal-note">Une version sans le lieu ni les surprises, pour la montrer à tes proches. On ne peut pas y répondre.</p>`;
async function shareSurprise(){
  if(EXAMPLE){ toast("C'est un exemple : rien n'est partagé"); return; }
  if(!shareLink) return;
  const text=`Regarde ce que ${D.f} m'a préparé ✨`;
  if(navigator.share){ navigator.share({title:"Ose Demander", text, url:shareLink}).catch(()=>{}); return; }
  toast(await copyText(shareLink) ? "Lien copié, envoie-le à qui tu veux" : "Copie impossible");
}
function replyText(){
  const occ = D.o==="libre" ? (D.of||"ton invitation") : (OCC[D.o]?.label||"ton invitation");
  let t=`Oui ! ✅ ${D.t} accepte ton invitation (${occ.charAt(0).toLowerCase()+occ.slice(1)}).`;
  const w=whenText(); if(w) t+=` Rendez-vous ${w}.`;
  return t+" 💌";
}

}

/* Lien du rappel d'agenda (version allégée, voir reminderData), préparé à l'avance :
   les boutons d'agenda n'apparaissent qu'une fois le lien prêt. "wait" | "ok" | "none" (échec : agenda sans lien) */
let remLink="", remState="wait";
let shareLink="", shareState="wait"; // lien « Partager la surprise » (voir shareData) : "wait" | "ok" | "none" (non autorisé ou échec)
function prepReminder(){
  const slot=chosenSlot; remLink=""; remState="wait"; shareLink=""; shareState="wait"; revNotif={etat:"", inv:""};
  if(D.sl && slot===null) return;
  const base=location.origin+location.pathname;
  // Lien court chiffré (son propre contenu allégé, sa propre clé), sinon le lien complet ; jamais en mode exemple
  const publish=async code=>{ if(!EXAMPLE){ const sh=await createShort(code, base); if(sh) return sh.link; } return base+"#i="+code; };
  const refresh=()=>{ const a=$("#actions"); if(a){ a.innerHTML=actionsHTML(); bindActions(); } };
  if(D.pa===0 || D.vu) shareState="none";
  else encodeData(shareData(D, slot)).then(publish).then(l=>{ if(slot!==chosenSlot) return; shareLink=l; shareState="ok"; refresh(); }).catch(()=>{ shareState="none"; });
  const done=(link,state)=>{ if(slot!==chosenSlot) return; remLink=link; remState=state; refresh(); syncRevealNotif(); };
  // Déjà ouverte depuis un lien de rappel court : c'est ce lien-là qui va dans l'agenda (rien de nouveau n'est déposé)
  if(D.rv && SHORT_HASH.test(location.hash)){ done(base+location.hash, "ok"); return; }
  encodeData(reminderData(D, slot)).then(publish).then(l=>done(l,"ok")).catch(()=>done("","none"));
}
async function reply(){
  if(D.sl && chosenSlot===null){ toast("Choisis d'abord ton créneau"); return; }
  sendReply(replyText());
}
/* Envoie une réponse (Oui ou vrai refus) par le canal choisi par l'expéditeur */
async function sendReply(txt){
  if(EXAMPLE){ toast("C'est un exemple : aucune réponse n'est envoyée"); return; }
  const id=D.ci||"";
  const open=u=>{ window.location.href=u; };
  switch(D.c){
    case "wa": open(`https://wa.me/${cleanPhone(id)}?text=${encodeURIComponent(txt)}`); break;
    case "sms": open(`sms:${encodeURIComponent(id.replace(/[^\d+]/g,""))}?&body=${encodeURIComponent(txt)}`); break;
    case "snap": await copyText(txt); toast("Réponse copiée, colle-la dans le chat 😉"); setTimeout(()=>open(`https://www.snapchat.com/add/${encodeURIComponent(id.replace(/^@/,""))}`),900); break;
    case "ig": await copyText(txt); toast("Réponse copiée, colle-la dans le chat 😉"); setTimeout(()=>open(`https://ig.me/m/${encodeURIComponent(id.replace(/^@/,""))}`),900); break;
    case "fb": await copyText(txt); toast("Réponse copiée, colle-la dans le chat 😉"); setTimeout(()=>open(`https://m.me/${encodeURIComponent(id.replace(/^@/,""))}`),900); break;
    default:
      if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); }
      else toast(await copyText(txt)?"Réponse copiée, envoie-la où tu veux":"Copie impossible");
  }
}
/* ---------- Agenda ----------
   Un site ne peut pas écrire dans l'agenda : on propose un lien Google Agenda ou un fichier .ics.
   L'événement ne contient jamais d'info secrète (surprise, ou révélation pas encore atteinte). */
const isAndroid = () => /android/i.test(navigator.userAgent);
function shownValue(it){ // valeur affichable d'une info, ou "" si elle est encore secrète
  if(!it) return "";
  if(it.v==="v") return it.x;
  if(it.v==="r" && revealable(it.at)){ try{ return unscramble(it.e).slice(0,120); }catch(e){} }
  return "";
}
function calEvent(){
  let d,t;
  if(D.sl){ [d,t]=D.sl[chosenSlot]; } else { d=D.d; t=D.h; }
  const [Y,M,Dd]=d.split("-").map(Number), [hh,mm]=t.split(":").map(Number);
  const start=new Date(Y,M-1,Dd,hh,mm);
  let end=new Date(start.getTime()+2*3600e3);
  if(D.en){ const [eh,em]=D.en.split(":").map(Number); end=new Date(Y,M-1,Dd,eh,em); if(end<=start) end.setDate(end.getDate()+1); }
  const occ = D.o==="libre" ? (D.of||"Invitation") : (OCC[D.o]?.label||"Invitation");
  const act = D.p ? "" : shownValue(D.a);
  const title = (D.p ? (D.p.some(s=>s.v!=="v")?"Journée surprise":"Journée") : (act || "Surprise")) + ` avec ${D.f}`;
  const loc = D.p ? (D.me||"") : (shownValue(D.l) || "");
  const desc=`${occ}. Invitation créée avec Ose Demander.` + (remLink ? `\n\nTon invitation : ${remLink}` : "");
  return {start, end, title, loc, desc, url:remLink};
}
/* Google Agenda ne permet pas de fixer les alertes par lien : ce sont celles réglées par défaut dans l'agenda */
function googleCalUrl(ev=calEvent()){
  const p=new URLSearchParams({action:"TEMPLATE", text:ev.title, dates:`${calFmt(ev.start)}/${calFmt(ev.end)}`, details:ev.desc});
  try{ p.set("ctz", Intl.DateTimeFormat().resolvedOptions().timeZone); }catch(e){}
  if(ev.loc) p.set("location", ev.loc);
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function downloadICS(){ saveFile("invitation.ics", icsText([calEvent()]), "text/calendar"); }
// Toutes les révélations à venir dans un seul fichier (un événement chacune)
const upcomingReveals = () => revealEvents(D, Date.now(), remLink);
function downloadRevealICS(){ const evs=upcomingReveals(); if(evs.length) saveFile("revelation.ics", icsText(evs), "text/calendar"); }
/* iPhone : le fichier .ics ouvre directement Calendrier. Ailleurs : Google Agenda en premier. */
function calButtonsHTML(){
  const g=`href="${esc(googleCalUrl())}" target="_blank" rel="noopener noreferrer" id="gcal"`;
  const note = remLink ? `<p class="cal-note">Le lien de ton invitation sera enregistré dans ton agenda.</p>` : "";
  const main = isIOS()
    ? `<button type="button" class="btn" id="cal">Ajouter à mon agenda</button>
       <a class="cal-alt" ${g}>Google Agenda</a>`
    : `<a class="btn" ${g}>Ajouter à Google Agenda</a>
       <button type="button" class="cal-alt" id="cal">Autre agenda (fichier .ics)</button>`;
  return main + revealButtonsHTML() + note;
}
/* « Me rappeler la révélation » : seulement s'il reste des révélations à venir. Google : un lien par révélation. */
function revealButtonsHTML(){
  const evs=upcomingReveals(); if(!evs.length) return "";
  const hint = revealAgendaOnly() ? `<p class="rev-agenda">Ajoute un rappel à ton agenda pour ne pas manquer la surprise.</p>` : "";
  const when=ev=>`${frDate(calFmt(ev.start).replace(/^(\d{4})(\d{2})(\d{2}).*/,"$1-$2-$3"))} à ${frTime(ev.start.toTimeString().slice(0,5))}`;
  const glink=(ev,cls,label)=>`<a class="${cls}" href="${esc(googleCalUrl(ev))}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
  const many=evs.length>1;
  return hint + (isIOS()
    ? `<button type="button" class="btn" id="calRev">Me rappeler ${many?"les révélations":"la révélation"} 🔓</button>
       ${evs.map(ev=>glink(ev,"cal-alt",`Google Agenda${many?` : ${when(ev)}`:""}`)).join("")}`
    : `${evs.map(ev=>glink(ev,"btn",`Me rappeler la révélation${many?` du ${when(ev)}`:""} 🔓`)).join("")}
       <button type="button" class="cal-alt" id="calRev">${many?"Rappels":"Rappel"} dans un autre agenda (fichier .ics)</button>`);
}
/* Comptes à rebours + révélations : première vérification après « delay » (le temps que la carte apparaisse) */
function startCountdowns(delay=0){
  clearInterval(countTimer); clearTimeout(revStart);
  const tick=()=>{
    $$(".count[data-at]").forEach(el=>{ if(!revealable(el.dataset.at)) el.textContent=countdown(el.dataset.at); });
    checkReveals();
    if(revealKeys(D).every(([k])=>revShown.has(k))) clearInterval(countTimer);
  };
  revStart=setTimeout(()=>{ tick(); countTimer=setInterval(tick,1000); }, delay);
}

  const pick=a=>a[Math.floor(Math.random()*a.length)];

  function size(){
    const dpr=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    for(const c of [back,front]){ c.width=W*dpr; c.height=H*dpr; c.style.width=W+"px"; c.style.height=H+"px"; }
    bx.setTransform(dpr,0,0,dpr,0,0); fx.setTransform(dpr,0,0,dpr,0,0);
  }
  function make(initial){
    const c=cfg(), k=eff()==="d"?.6:1;
    const kind=Array.isArray(c.shape) ? pick(c.shape) : c.shape;
    const p={x:rnd(0,W), y:rnd(0,H), s:rnd(6,11), r:rnd(0,6.28), vr:rnd(-.015,.015)*k, k:kind, c:pick((c.kcols&&c.kcols[kind])||c.cols), ph:rnd(0,6.28), a:rnd(.27,.62), st:null, n:0, vx:0, vy:0,
      ox:0, oy:0, vox:0, voy:0}; // écart dû au pointeur (revient à 0 tout seul)
    if(eff()==="d") p.a*=.75;
    switch(c.move){
      case "rise": p.vy=-rnd(.25,.6)*k; if(!initial) p.y=H+20; break;
      case "fall": p.vx=rnd(-.2,.2)*k; p.vy=rnd(.35,.8)*k; p.vr=rnd(-.04,.04)*k; if(!initial) p.y=-20; break;
      case "drift": p.vx=rnd(-.35,.35)*k; p.vy=rnd(-.25,.25)*k; if(!initial) p.y=-15; break;
      case "bounce": p.vx=rnd(-.6,.6)*k; p.vy=rnd(-.6,.6)*k; p.s=rnd(7,14); break;
      case "twinkle": p.s=rnd(4,9); break;
      case "fly": { const d=Math.random()<.5?-1:1; p.vx=d*rnd(.35,.8)*k; p.s=rnd(8,13); if(!initial) p.x=d>0?-25:W+25; break; }
    }
    if(kind.startsWith("e:")){ p.a=rnd(.6,.9)*(eff()==="d"?.75:1); p.s=rnd(10,14); } // emojis : plus visibles, à peine plus grands (quel que soit le mouvement)
    return p;
  }
  // Nombre d'éléments : Normales 18 (téléphone) ou 26 (ordinateur), Discrètes 10
  function populate(){ const e=eff(); const n=e==="0"?0:e==="d"?10:(W<600?18:26); P=Array.from({length:n},()=>make(true)); }

  // « ? » dessiné une fois par couleur dans une petite image, puis collé à la bonne taille (bien plus rapide que du texte)
  const Q_BOX=64, Q_FONT=52, qSprites=new Map();
  function qSprite(col){
    let c=qSprites.get(col);
    if(!c){ c=document.createElement("canvas"); c.width=c.height=Q_BOX; const g=c.getContext("2d");
      g.font=`700 ${Q_FONT}px Georgia, serif`; g.textAlign="center"; g.textBaseline="middle"; g.fillStyle=col; g.fillText("?",Q_BOX/2,Q_BOX/2+2); qSprites.set(col,c); }
    return c;
  }
  // Emoji dessiné une fois dans une petite image, puis collé (comme le « ? »)
  const eSprites=new Map();
  function eSprite(ch){
    let c=eSprites.get(ch);
    if(!c){ c=document.createElement("canvas"); c.width=c.height=Q_BOX; const g=c.getContext("2d");
      g.font=`${Q_FONT-8}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; g.textAlign="center"; g.textBaseline="middle"; g.fillText(ch,Q_BOX/2,Q_BOX/2+3); eSprites.set(ch,c); }
    return c;
  }
  function shape(ctx,kind,s,col){
    if(kind.startsWith("e:")){ const d=s*2.6; ctx.drawImage(eSprite(kind.slice(2)),-d/2,-d/2,d,d); return; }
    ctx.fillStyle=col; ctx.strokeStyle=col; ctx.beginPath();
    switch(kind){
      case "heart":
        ctx.moveTo(0,s*.8); ctx.bezierCurveTo(-s*1.2,-s*.1,-s*.6,-s,0,-s*.4); ctx.bezierCurveTo(s*.6,-s,s*1.2,-s*.1,0,s*.8); ctx.fill(); break;
      case "petal": ctx.ellipse(0,0,s*.45,s,0,0,Math.PI*2); ctx.fill(); break;
      case "star5":
        for(let i=0;i<10;i++){ const r=i%2?s*.45:s, a=i*Math.PI/5-Math.PI/2; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); } ctx.closePath(); ctx.fill(); break;
      case "sparkle":
        ctx.moveTo(0,-s); ctx.quadraticCurveTo(0,0,s,0); ctx.quadraticCurveTo(0,0,0,s); ctx.quadraticCurveTo(0,0,-s,0); ctx.quadraticCurveTo(0,0,0,-s); ctx.fill(); break;
      case "bubble":
        ctx.lineWidth=2; ctx.arc(0,0,s,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(-s*.35,-s*.35,s*.2,0,Math.PI*2); ctx.fill(); break;
      case "confetti": ctx.fillRect(-s*.6,-s*.25,s*1.2,s*.5); break;
      case "q": { const d=s*2.2*Q_BOX/Q_FONT; ctx.drawImage(qSprite(col),-d/2,-d/2,d,d); break; }
      // Halloween (amusant, jamais effrayant) : chauve-souris qui bat des ailes, petit fantôme souriant, citrouille, bonbon
      case "bat": {
        const f=.55+.45*Math.abs(Math.sin(t*.18));
        ctx.ellipse(0,0,s*.28,s*.42,0,0,Math.PI*2);
        for(const d of [-1,1]){ ctx.moveTo(d*s*.2,-s*.15); ctx.quadraticCurveTo(d*s*.9,-s*f,d*s*1.5,-s*.3*f); ctx.quadraticCurveTo(d*s*1.25,0,d*s*1.05,s*.15*f);
          ctx.quadraticCurveTo(d*s*.85,-s*.05,d*s*.65,s*.25*f); ctx.quadraticCurveTo(d*s*.45,0,d*s*.2,s*.2); ctx.closePath(); }
        ctx.moveTo(-s*.22,-s*.3); ctx.lineTo(-s*.14,-s*.62); ctx.lineTo(-s*.04,-s*.36); ctx.moveTo(s*.22,-s*.3); ctx.lineTo(s*.14,-s*.62); ctx.lineTo(s*.04,-s*.36);
        ctx.fill(); break;
      }
      case "ghost":
        ctx.moveTo(-s*.8,s*.9); ctx.lineTo(-s*.8,-s*.1); ctx.arc(0,-s*.1,s*.8,Math.PI,0); ctx.lineTo(s*.8,s*.9);
        ctx.quadraticCurveTo(s*.53,s*.55,s*.27,s*.9); ctx.quadraticCurveTo(0,s*1.2,-s*.27,s*.9); ctx.quadraticCurveTo(-s*.53,s*.55,-s*.8,s*.9); ctx.fill();
        ctx.fillStyle="#221432"; ctx.beginPath(); ctx.ellipse(-s*.28,-s*.15,s*.12,s*.17,0,0,Math.PI*2); ctx.ellipse(s*.28,-s*.15,s*.12,s*.17,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0,s*.2,s*.1,0,Math.PI*2); ctx.fill(); break;
      case "pumpkin":
        for(const [x,rx] of [[-s*.38,s*.55],[s*.38,s*.55],[0,s*.62]]){ ctx.beginPath(); ctx.ellipse(x,0,rx,s*.75,0,0,Math.PI*2); ctx.fill(); }
        ctx.fillStyle="#3E7A3A"; ctx.fillRect(-s*.1,-s*1.05,s*.2,s*.35); break;
      // Noël : flocon, bonnet, cadeau ; Réveillon : étincelle de feu d'artifice (orientée dans le sens de sa course)
      case "flake":
        ctx.lineWidth=Math.max(1.5,s*.16); ctx.lineCap="round";
        for(let i=0;i<3;i++){ const a=i*Math.PI/3; ctx.moveTo(Math.cos(a)*s,Math.sin(a)*s); ctx.lineTo(-Math.cos(a)*s,-Math.sin(a)*s); }
        ctx.stroke(); break;
      case "hat":
        ctx.moveTo(-s*.8,s*.4); ctx.quadraticCurveTo(-s*.2,-s*1.1,s*.9,-s*.5); ctx.quadraticCurveTo(s*.2,-s*.2,s*.8,s*.4); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#FFFFFF"; ctx.fillRect(-s*.95,s*.3,s*1.9,s*.4); ctx.beginPath(); ctx.arc(s*.95,-s*.5,s*.25,0,Math.PI*2); ctx.fill(); break;
      case "gift":
        ctx.fillRect(-s*.75,-s*.6,s*1.5,s*1.3); ctx.fillStyle="#E8B23A"; ctx.fillRect(-s*.12,-s*.6,s*.24,s*1.3); ctx.fillRect(-s*.75,-s*.12,s*1.5,s*.24);
        ctx.beginPath(); ctx.ellipse(-s*.25,-s*.75,s*.25,s*.15,-.5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(s*.25,-s*.75,s*.25,s*.15,.5,0,Math.PI*2); ctx.fill(); break;
      case "spark": ctx.fillRect(-s*.9,-s*.13,s*1.8,s*.26); break;
      // Galette : couronne, fève ; Saint-Valentin : lettre ; Pâques : œuf décoré, fleur ; fête des pères : cravate ; musique : notes
      case "crown":
        ctx.moveTo(-s,s*.5); ctx.lineTo(-s,-s*.4); ctx.lineTo(-s*.5,s*.05); ctx.lineTo(0,-s*.7); ctx.lineTo(s*.5,s*.05); ctx.lineTo(s,-s*.4); ctx.lineTo(s,s*.5); ctx.closePath(); ctx.fill(); break;
      case "bean": ctx.ellipse(0,0,s*.45,s*.65,0,0,Math.PI*2); ctx.fill(); break;
      case "letter":
        ctx.fillRect(-s,-s*.65,s*2,s*1.3); ctx.strokeStyle="#E5173F"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-s,-s*.65); ctx.lineTo(0,s*.1); ctx.lineTo(s,-s*.65); ctx.stroke(); break;
      case "egg":
        ctx.moveTo(0,-s); ctx.bezierCurveTo(s*.75,-s,s*.8,s*.75,0,s*.75); ctx.bezierCurveTo(-s*.8,s*.75,-s*.75,-s,0,-s); ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=Math.max(1.5,s*.15); ctx.beginPath(); ctx.moveTo(-s*.6,0); ctx.lineTo(-s*.3,-s*.2); ctx.lineTo(0,0); ctx.lineTo(s*.3,-s*.2); ctx.lineTo(s*.6,0); ctx.stroke(); break;
      case "flower":
        for(let i=0;i<5;i++){ const a=i*1.2566, x=Math.cos(a)*s*.5, y=Math.sin(a)*s*.5; ctx.moveTo(x+s*.38,y); ctx.arc(x,y,s*.38,0,Math.PI*2); }
        ctx.fill(); ctx.fillStyle="#FFF4C2"; ctx.beginPath(); ctx.arc(0,0,s*.3,0,Math.PI*2); ctx.fill(); break;
      case "tie":
        ctx.moveTo(-s*.3,-s); ctx.lineTo(s*.3,-s); ctx.lineTo(s*.18,-s*.6); ctx.lineTo(s*.45,s*.7); ctx.lineTo(0,s); ctx.lineTo(-s*.45,s*.7); ctx.lineTo(-s*.18,-s*.6); ctx.closePath(); ctx.fill(); break;
      case "note":
        ctx.ellipse(-s*.3,s*.5,s*.42,s*.3,-.4,0,Math.PI*2); ctx.fill(); ctx.fillRect(s*.05,-s,s*.16,s*1.5);
        ctx.beginPath(); ctx.moveTo(s*.2,-s); ctx.quadraticCurveTo(s*.9,-s*.6,s*.6,-s*.05); ctx.quadraticCurveTo(s*.7,-s*.5,s*.2,-s*.6); ctx.fill(); break;
      case "note2":
        ctx.ellipse(-s*.55,s*.55,s*.35,s*.25,-.4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(s*.45,s*.4,s*.35,s*.25,-.4,0,Math.PI*2); ctx.fill();
        ctx.fillRect(-s*.28,-s*.7,s*.14,s*1.25); ctx.fillRect(s*.72,-s*.85,s*.14,s*1.25);
        ctx.beginPath(); ctx.moveTo(-s*.28,-s*.7); ctx.lineTo(s*.86,-s*.85); ctx.lineTo(s*.86,-s*.6); ctx.lineTo(-s*.28,-s*.45); ctx.fill(); break;
      // Ambiances : ballon (anniversaires, fête surprise), alliance (témoin)
      case "balloon":
        ctx.ellipse(0,-s*.2,s*.7,s*.85,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(0,s*.62); ctx.lineTo(-s*.15,s*.85); ctx.lineTo(s*.15,s*.85); ctx.fill();
        ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,s*.85); ctx.quadraticCurveTo(s*.3,s*1.3,0,s*1.8); ctx.stroke(); break;
      case "ring":
        ctx.lineWidth=Math.max(2,s*.28); ctx.arc(0,s*.15,s*.6,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle="#BFE3F2"; ctx.beginPath(); ctx.moveTo(0,-s*.95); ctx.lineTo(s*.3,-s*.62); ctx.lineTo(0,-s*.38); ctx.lineTo(-s*.3,-s*.62); ctx.closePath(); ctx.fill(); break;
      // Couple : photo-souvenir ; week-end : feuille ; dîner : flamme de bougie
      case "photo": ctx.fillRect(-s*.8,-s,s*1.6,s*1.9); ctx.fillStyle="#C9B6E4"; ctx.fillRect(-s*.62,-s*.82,s*1.24,s*1.2); break;
      case "leaf":
        ctx.moveTo(0,-s); ctx.quadraticCurveTo(s*.8,0,0,s); ctx.quadraticCurveTo(-s*.8,0,0,-s); ctx.fill();
        ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,-s*.8); ctx.lineTo(0,s*.8); ctx.stroke(); break;
      case "flame": ctx.moveTo(0,-s); ctx.quadraticCurveTo(s*.7,0,0,s*.6); ctx.quadraticCurveTo(-s*.7,0,0,-s); ctx.fill(); break;
      case "candy":
        ctx.arc(0,0,s*.45,0,Math.PI*2); ctx.moveTo(-s*.4,0); ctx.lineTo(-s*1.05,-s*.4); ctx.lineTo(-s*1.05,s*.4); ctx.closePath();
        ctx.moveTo(s*.4,0); ctx.lineTo(s*1.05,-s*.4); ctx.lineTo(s*1.05,s*.4); ctx.closePath(); ctx.fill(); break;

  /* Le décor s'écarte du pointeur (souris ou doigt). Seule la dernière position est gardée en mémoire,
     le temps du calcul ; elle est oubliée dès que le pointeur s'en va. Rien n'est enregistré ni envoyé. */
  const ptr={x:0, y:0, on:false};
  const setPtr=(x,y)=>{ ptr.x=x; ptr.y=y; ptr.on=true; }, clearPtr=()=>{ ptr.on=false; };
  const passive={passive:true};
  window.addEventListener("pointermove",e=>{ if(e.pointerType!=="touch") setPtr(e.clientX,e.clientY); },passive);
  for(const t of ["touchstart","touchmove"]) window.addEventListener(t,e=>{ const p=e.touches[0]; if(p) setPtr(p.clientX,p.clientY); },passive);
  window.addEventListener("touchend",e=>{ if(!e.touches.length) clearPtr(); },passive);
  window.addEventListener("touchcancel",clearPtr,passive);
  document.addEventListener("mouseout",e=>{ if(!e.relatedTarget) clearPtr(); });
  window.addEventListener("blur",clearPtr);
  const COARSE=matchMedia("(pointer:coarse)").matches;
  // R : rayon (100 px sur ordinateur, 80 px sur téléphone) ; force : plus faible en mode « Discrètes »
  function avoid(p, R, force){
    if(ptr.on && !p.st){
      const dx=p.x+p.ox-ptr.x, dy=p.y+p.oy-ptr.y, d2=dx*dx+dy*dy;
      if(d2<R*R && d2>.01){ const d=Math.sqrt(d2), f=1-d/R, k=f*f*force; p.vox+=dx/d*k; p.voy+=dy/d*k; }
    }
    // Poussée amortie, puis retour progressif sur la trajectoire normale
    p.vox*=.84; p.voy*=.84; p.ox=(p.ox+p.vox)*.965; p.oy=(p.oy+p.voy)*.965;
  }

  function step(){
    t++; bx.clearRect(0,0,W,H); gust*=.965;
    const c=cfg(), R=(W<600 || COARSE) ? 80 : 100, force=eff()==="d" ? .35 : .8;
    for(let i=0;i<P.length;i++){
      const p=P[i];
      avoid(p, R, force);
      if(p.st==="fall"){ p.vy+=.22; p.x+=p.vx; p.y+=p.vy; p.r+=.08; if(p.y>H+30){ P[i]=make(c.move!=="fall"&&c.move!=="rise"); continue; } }
      else if(p.st==="break"){ p.n++; p.vy+=.12; p.y+=p.vy; if(p.n>70){ P[i]=make(false); continue; } }
      else if(p.st==="pop"){ p.n++; if(p.n>18){ P[i]=make(true); continue; } }
      else {
        const sway = c.move==="rise" ? Math.sin(t*.02+p.ph)*.35 : 0;
        p.x+=p.vx+gust+sway; p.y+=p.vy+(c.move==="fly" ? Math.sin(t*.04+p.ph)*.5 : 0); p.r+=p.vr;
        if(c.move==="bounce"){ if(p.x<p.s||p.x>W-p.s) p.vx*=-1; if(p.y<p.s||p.y>H-p.s) p.vy*=-1; }
        else {
          if(p.y<-30||p.y>H+30){ P[i]=make(false); continue; }
          if(p.x<-30) p.x=W+20; if(p.x>W+30) p.x=-20;
        }
      }
      let a=p.a;
      if(c.move==="twinkle" && !p.st) a=.12+.7*Math.abs(Math.sin(t*.015+p.ph));
      bx.save(); bx.globalAlpha=a; bx.translate(p.x+p.ox,p.y+p.oy);
      if(p.st==="break"){
        bx.globalAlpha=a*(1-p.n/70);
        for(const side of [-1,1]){
          bx.save(); bx.translate(side*p.n*.5,0); bx.rotate(side*p.n*.025);
          bx.beginPath(); bx.rect(side<0?-p.s*2:0,-p.s*2,p.s*2,p.s*4); bx.clip(); shape(bx,p.k,p.s,p.c); bx.restore();
        }
      } else if(p.st==="pop"){
        bx.globalAlpha=a*(1-p.n/18); bx.lineWidth=2; bx.strokeStyle=p.c; bx.beginPath(); bx.arc(0,0,p.s*(1+p.n*.12),0,Math.PI*2); bx.stroke();
      } else {
        bx.rotate(c.move==="rise" ? Math.sin(t*.02+p.ph)*.3 : c.move==="fly" || p.k.startsWith("e:") ? Math.sin(t*.04+p.ph)*.15 : p.r); shape(bx,p.k,p.s,p.c);
      }
      bx.restore();
    }
    // Étoile filante (thème Mystère)
    if(theme==="mystere" && eff()==="n"){
      if(!shoot && t>nextShoot){ shoot={x:rnd(W*.3,W),y:rnd(0,H*.35),n:0}; nextShoot=t+rnd(420,900); }
      if(shoot){
        shoot.n++; const L=90, k=shoot.n*7, x=shoot.x-k, y=shoot.y+k*.45;
        const g=bx.createLinearGradient(x,y,x+L,y-L*.45); g.addColorStop(0,"rgba(255,233,170,.9)"); g.addColorStop(1,"rgba(255,233,170,0)");
        bx.strokeStyle=g; bx.lineWidth=2; bx.beginPath(); bx.moveTo(x,y); bx.lineTo(x+L,y-L*.45); bx.stroke();
        if(shoot.n>45) shoot=null;
      }
    }
    raf=requestAnimationFrame(step);
  }
  function start(){ if(!raf && eff()!=="0" && !document.hidden) raf=requestAnimationFrame(step); }
  function stop(){ if(raf) cancelAnimationFrame(raf); raf=null; }
  // Lance (ou arrête) l'animation selon le niveau voulu ; sans effet si elle tourne déjà
  function run(){ if(eff()==="0"){ stop(); bx.clearRect(0,0,W,H); } else start(); }

  function fstep(){
    fx.clearRect(0,0,W,H);
    for(const p of B){
      p.vy+=.3; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
      fx.save(); fx.globalAlpha=Math.max(0,1-p.life/p.max); fx.translate(p.x,p.y); fx.rotate(p.r); shape(fx,p.k,p.s,p.c); fx.restore();
    }
    B=B.filter(p=>p.life<p.max && p.y<H+40);
    fraf = B.length ? requestAnimationFrame(fstep) : (fx.clearRect(0,0,W,H), null);
  }

  document.addEventListener("visibilitychange",()=>{ document.hidden ? stop() : start(); });

  return {
    paint: shape, // utilisée aussi pour les images « Partager en image »
    set(th, lv){
      // Même thème et même niveau : on garde les éléments, mais on s'assure que l'animation tourne
      if(!(th===theme && lv===level && (P.length || lv==="0"))){ theme=th; level=lv; shoot=null; gust=0; populate(); }
      run();
    },
    react(){
      if(eff()==="0" || !P.length) return;
      const kind=cfg().react||"fall";
      if(kind==="gust"){ gust=(Math.random()<.5?-1:1)*5; return; }
      // Les éléments s'éparpillent loin du centre, puis reviennent d'eux-mêmes sur leur trajet
      if(kind==="scatter"){ const f=eff()==="d"?4:9; for(const p of P){ if(p.st) continue; const dx=p.x-W/2, dy=p.y-H/2, d=Math.hypot(dx,dy)||1; p.vox+=dx/d*f; p.voy+=dy/d*f; } return; }
      const free=P.filter(p=>!p.st).sort(()=>Math.random()-.5).slice(0,3);
      free.forEach(p=>{ p.st=kind; p.n=0; p.vy=kind==="fall"?1:.4; p.vx=rnd(-1,1); });
    },
    burst(x,y,n,small){
      const e=eff(); if(e==="0") return;
      const c=cfg(), kinds=c.burst||[c.shape];
      const cols = theme==="fete"||theme==="base" ? [...c.cols,"#FFC94A","#3CC48A"] : c.cols;
      const count=Math.round(n*(e==="d"?.45:1)), sp=small?.45:1;
      const col=k=>pick((c.kcols&&c.kcols[k])||cols);
      if(c.fw){ // feu d'artifice : une gerbe ronde au point touché, et deux dans le ciel (une seule en « Discrètes » ou pour un petit éclat)
        const shots=e==="d"||small ? 1 : 3, m=Math.round(count/shots);
        for(let j=0;j<shots;j++){
          const cx=j?rnd(W*.15,W*.85):x, cy=j?rnd(H*.1,H*.4):y;
          for(let i=0;i<m;i++){ const k=pick(kinds), a=i/m*6.283+rnd(-.1,.1), v=rnd(4,8)*sp; B.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:rnd(5,9),r:a,vr:0,c:col(k),k,life:0,max:rnd(60,100)}); }
        }
        if(!fraf) fraf=requestAnimationFrame(fstep); return;
      }
      for(let i=0;i<count;i++){ const k=pick(kinds); B.push({x,y,vx:rnd(-9,9)*sp,vy:rnd(-15,-5)*sp,s:rnd(6,12),r:rnd(0,6.28),vr:rnd(-.2,.2),c:col(k),k,life:0,max:rnd(90,150)}); }
      if(!fraf) fraf=requestAnimationFrame(fstep);
    },
    resize(){ size(); populate(); run(); },
    // Lecture seule (vérifications) : nombre d'éléments et écart actuel dû au pointeur
    info(){ return {n:P.length, running:!!raf, pts:P.map(p=>({x:p.x+p.ox, y:p.y+p.oy, off:Math.hypot(p.ox,p.oy), st:p.st}))}; }
  };
})();

/* ---------- Son (activé par défaut, sons brefs seulement, jamais de musique) ----------
   Les navigateurs n'autorisent le son qu'après un geste : il démarre au premier clic
   (créateur) ou au toucher de l'enveloppe (destinataire).
   Côté créateur, le choix 🔊/🔇 est gardé dans le stockage local. Côté destinataire, rien n'est enregistré. */
const SOUND_KEY="ose-son";
const Sound = {
  on:true, ctx:null,
  pref(){ try{ return localStorage.getItem(SOUND_KEY)!=="0"; }catch(e){ return true; } },
  savePref(){ try{ localStorage.setItem(SOUND_KEY, this.on?"1":"0"); }catch(e){} },
  init(){ try{ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==="suspended") this.ctx.resume(); }catch(e){} },
  tone(f1,f2,dur,type="sine",vol=.1,delay=0){
    if(!this.on||!this.ctx) return;
    const c=this.ctx, t0=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.02);
  },
  pop(){ this.tone(700,1300,.09,"sine",.08); },
  card(){ this.tone(420,880,.08,"triangle",.045); }, // carte de l'introduction qui s'envole
  no(){ this.tone(320,170,.18,"triangle",.09); },
  yes(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,f*1.01,.28,"sine",.09,i*.09)); },
  // Révélation : déclic du cadenas puis scintillement. Sans geste préalable, le navigateur bloque le son :
  // on ne joue rien (pour ne pas lâcher des sons en retard au premier toucher).
  reveal(){
    if(!this.ctx || this.ctx.state!=="running") return;
    this.tone(260,520,.07,"square",.035); [784,988,1319,1568].forEach((f,i)=>this.tone(f,f*1.01,.24,"sine",.07,.09+i*.07));
  },
  // Créateur : sons courts et discrets
  tick(){ this.tone(880,1040,.05,"sine",.035); },                                   // choix d'une option
  step(){ this.tone(560,620,.06,"sine",.04); this.tone(760,820,.07,"sine",.04,.06); }, // passage d'étape
  done(){ [660,880,1320].forEach((f,i)=>this.tone(f,f*1.01,.14,"sine",.05,i*.08)); }  // lien créé
};
// Le premier geste (clic, touche) débloque le son ; aucun son n'est joué sans geste
["click","keydown"].forEach(t=>document.addEventListener(t,()=>{ if(Sound.on) Sound.init(); },{capture:true}));

/* ---------- Appli installable (PWA) ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; refreshInstall(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; refreshInstall(); toast("Ose Demander est installée 🎉"); });
function refreshInstall(){
  const slot=$("#installSlot"); if(!slot) return;
  if(isStandalone() || (!installEvt && !isIOS())){ slot.innerHTML=`<small>Gratuit, sans compte</small>`; return; }
  slot.innerHTML=`<button type="button" class="install" id="installBtn">Installer l'appli</button>`;
  $("#installBtn").addEventListener("click",async()=>{
    if(installEvt){ installEvt.prompt(); const r=await installEvt.userChoice.catch(()=>null); installEvt=null; refreshInstall(); return; }
    showIOSHelp();
  });
}
/* « Installer l'appli » du pied de page : la fenêtre du navigateur si elle est prête, sinon les étapes à suivre */
async function installHelp(){
  if(isStandalone()){ toast("Ose Demander est déjà installée sur cet appareil"); return; }
  if(installEvt){ try{ installEvt.prompt(); await installEvt.userChoice.catch(()=>null); installEvt=null; refreshInstall(); return; }catch(e){} }
  showIOSHelp(!isIOS());
}
function showIOSHelp(autre=false){
  const d=document.createElement("div"); d.className="sheet"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-label","Installer l'appli");
  d.innerHTML=`<div class="sheet-card">
    <h3>Installer Ose Demander</h3>
    ${autre ? `<ol>
      <li>Ouvre ce site dans <b>Chrome</b> ou <b>Edge</b>.</li>
      <li>Ouvre le menu (les trois points).</li>
      <li>Choisis <b>Installer l'application</b> ou <b>Ajouter à l'écran d'accueil</b>.</li>
    </ol>` : `<ol>
      <li>Ouvre ce site dans <b>Safari</b>.</li>
      <li>Touche le bouton <b>Partager</b> (le carré avec une flèche vers le haut).</li>
      <li>Choisis <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>.</li>
    </ol>`}
    <button type="button" class="btn primary" style="width:100%">Compris</button></div>`;
  d.addEventListener("click",e=>{ if(e.target===d || e.target.tagName==="BUTTON") d.remove(); });
  document.body.appendChild(d); $("button",d).focus();
}
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  // Réponse reçue par notification pendant que la page est ouverte (voir sw.js) : « Mes invitations » se met à jour
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data && e.data.type==="ose-reponse") typeof syncReplies==="function" && syncReplies().then(ch=>{ if(ch && location.hash==="#mes-invitations") renderHistory(); }); });
}

/* ---------- Routage ---------- */

const LINK_ERRORS={

  introuvable:{t:"Ce lien est introuvable", p:"Aucune invitation ne correspond à ce lien. Il a peut-être été mal copié : vérifie-le, ou demande à la personne qui te l'a envoyé de te le renvoyer."},
  incomplet:{t:"Ce lien est incomplet", p:"Une partie du lien s'est perdue en route, souvent au moment de le copier. Demande à la personne qui te l'a envoyé de te le renvoyer en entier."},
  reseau:{t:"Le service ne répond pas", p:"Le service des liens courts fait une petite sieste, ou ta connexion s'est interrompue. Vérifie ta connexion, puis réessaie dans un instant."},

  charge:{t:"La page ne s'est pas chargée", p:"Une partie d'Ose Demander n'est pas arrivée jusqu'ici. Vérifie ta connexion, puis réessaie.", art:"reseau"},

};
/* Illustrations (viewBox 0 0 200 140), aux couleurs du thème : contours à l'encre, enveloppe à l'accent */
const ERR_ART={

    <g class="ea-flip"><path class="es eo" d="M146 34 H184 M146 116 H184"/><path class="es eo" d="M151 37 H179 C179 60 170 66 165 75 C170 84 179 90 179 113 H151 C151 90 160 84 165 75 C160 66 151 60 151 37 Z"/>

  // Boîte aux lettres vide, porte ouverte, drapeau baissé, « ? » qui flotte
  introuvable:`<rect class="el eo" x="92" y="88" width="14" height="46"/><path class="ea eo" d="M58 52 a22 22 0 0 1 22 -22 H128 a22 22 0 0 1 22 22 V92 H58 Z"/>
    <path class="ei" d="M66 54 a14 14 0 0 1 14 -14 H84 a14 14 0 0 1 14 14 V86 H66 Z" opacity=".85"/><path class="es eo" d="M66 86 L44 102 V68 L66 52 Z"/>
    <g class="ea-flag"><path class="eo" d="M150 74 H166" /><path class="es eo" d="M164 74 V94 H174 V82 H164"/></g>
    <text class="eq ea-float" x="114" y="24" font-size="34">?</text><path class="en eo" d="M30 134 H170"/>`,
  // Enveloppe déchirée en deux, petits morceaux de papier entre les deux moitiés
  incomplet:`<g class="ea-left"><path class="ea eo" d="M30 48 H96 L88 62 L100 76 L86 90 L98 104 L90 124 H38 a8 8 0 0 1 -8 -8 Z"/><path class="en eo" d="M30 52 L90 90"/></g>
    <g class="ea-right"><path class="ea eo" d="M108 48 H162 a8 8 0 0 1 8 8 V116 a8 8 0 0 1 -8 8 H100 L108 104 L96 90 L110 76 L98 62 Z"/><path class="en eo" d="M170 52 L108 92"/></g>

for(const k of Object.keys(ERR_ART)) ERR_ART[k]=sepText(ERR_ART[k]);
function renderLinkError(kind, lv=REDUCED_ANIM ? "0" : "n"){
  const e=LINK_ERRORS[kind] ? kind : "incomplet", {t,p,art=e}=LINK_ERRORS[e];
  setTheme("base", lv, "", "home");
  document.title=`${t} — Ose Demander`;
  $("#app").innerHTML=`<main class="inv err-screen" data-err="${e}">
    <div class="ticket err-card${lv==="0" ? "" : " pop-in"}"><div class="main">
      <svg class="err-ill anim-${lv}" viewBox="0 0 200 140" aria-hidden="true" focusable="false">${ERR_ART[art]}</svg>
      <h1 class="question" tabindex="-1">${t}</h1>
      <p class="err-text">${p}</p>
      <div class="err-actions">
        ${e==="charge" ? `<button type="button" class="btn primary" id="retry">Réessayer</button>`
          : e==="version" ? `<button type="button" class="btn primary" id="reload">Recharger la page</button>`
          : `<a class="btn primary" href="./">Créer ma propre invitation</a>${e==="reseau" ? `<button type="button" class="btn" id="retry">Réessayer</button>` : ""}`}
      </div>
    </div></div>
  </main>`;
  $("#retry")?.addEventListener("click", e=>{ e.currentTarget.disabled=true; e.currentTarget.textContent="Nouvel essai…"; route(); });
  $("#reload")?.addEventListener("click", ()=>location.reload());
  focusScreen(".question");
}
/* Une invitation ouverte (#i=, #s=, exemple) n'est jamais indexée par les moteurs de recherche.
   Sa partie après « # » n'est de toute façon jamais envoyée au serveur ; ceci est une sécurité de plus. */
function setNoindex(on){
  let m=document.querySelector('meta[name="robots"]');
  if(on && !m){ m=document.createElement("meta"); m.name="robots"; m.content="noindex, nofollow"; document.head.appendChild(m); }
  if(!on && m) m.remove();
}
async function route(){
  scenesReady().catch(()=>{}); // jamais bloquant ici
  const ms=location.hash.match(SHORT_HASH), m=ms ? null : location.hash.match(/^#i=(.+)$/);
  EXAMPLE = location.hash==="#exemple";
  setNoindex(!!(m || ms || EXAMPLE));
  if(!m && !ms && !EXAMPLE){ // côté créateur : le code de la création (app/creer.js) d'abord
    if(!await needCreer()) return;
    Sound.on=Sound.pref(); // le choix gardé sur cet appareil
  }
  if(location.hash==="#mes-invitations"){ renderHistory(); focusScreen(".panel h2"); return; }
  // Liens du pied de page : l'accueil, défilé jusqu'aux catégories, ou l'aide à l'installation ; l'adresse redevient celle de l'accueil
  if(location.hash==="#choisir" || location.hash==="#installer"){
    const quoi=location.hash; history.replaceState(null, "", location.pathname);
    S.step="home"; S.link=""; renderCreator();
    if(quoi==="#choisir"){ $("#choisir")?.scrollIntoView({block:"start"}); $(".home-card")?.focus({preventScroll:true}); }
    else installHelp();
    return;
  }
  // Lien d'une page d'occasion : ouvre directement ce modèle (de saison compris, toute l'année), comme un choix sur l'accueil.
  // L'identifiant est validé contre la liste des modèles ; on le retire ensuite de l'adresse (un rechargement ne réinitialise rien).
  const mod=location.hash.match(/^#modele=([a-z]{2,20})$/), tpl=mod && TEMPLATES.find(t=>t.id===mod[1]);
  if(mod){
    history.replaceState(null, "", location.pathname);
    if(tpl){ S.tplCat=tpl.cat; applyTemplate(tpl.id); S.step=2; S.link=""; renderCreator(); window.scrollTo({top:0}); focusScreen(".panel h2"); return; }
  }
  if(m || ms || EXAMPLE){
    try{
      let code = m ? m[1] : "";
      if(ms){ // lien court : on récupère le contenu chiffré, puis on le déchiffre ici (la clé ne quitte jamais l'appareil)
        setTheme("base","n");
        $("#app").innerHTML=`<main class="inv"><p class="lead" role="status" style="text-align:center">Ouverture de l'invitation…</p></main>`;
        code = await readShort(ms[1], ms[2]);
      }
      // Les scènes arrivent d'ordinaire avec la page : on les attend au plus 0,4 s, sinon l'écran s'affiche sans elles (sceneRefresh)
      await Promise.race([scenesReady().catch(()=>{}), new Promise(r=>setTimeout(r, 400))]);
      D = EXAMPLE ? demoData() : await decodeData(code); chosenSlot=null; yesDone=false; notifSent=""; // decodeData : sanitize, comme pour un lien long
      Sound.on = D.so!==0; // côté destinataire : réglage de l'invitation, rien n'est lu ni enregistré
      noTries=0; refused=false; refuseOffered=false; refuseWhy="non"; refuseDrafts={}; clearTimeout(refuseTimer);
      clearInterval(countTimer); clearTimeout(revStart); revQueue=[]; remLink=""; remState="wait";
      shareLink=""; shareState="wait";
      if(D.vu){ Sound.init(); renderShared(); } // version partagée : en lecture seule, ni enveloppe ni question
      else if(D.rv){ Sound.init(); renderReminder(); } else renderEnvelope(); // rappel d'agenda : directement la carte
      return;
    }
    catch(e){ renderLinkError(e && e.kind || "incomplet"); return; }
  }
  renderCreator();
}
window.addEventListener("hashchange",route);
// Après le Oui : toucher le fond fait jaillir des éléments du thème
document.addEventListener("pointerdown",e=>{
  if(!yesDone || invAnim()==="0") return;
  if(e.target.closest("button,a,input,textarea,.chip,.ticket")) return;
  Decor.burst(e.clientX, e.clientY, 16, true); Sound.pop();
});
// Icône de l'onglet pendant une période du logo de saison (sinon l'icône habituelle)
{ const f=logoFavicon(seasonToday()), l=document.querySelector('link[rel="icon"]'); if(f && l){ l.removeAttribute("sizes"); l.type="image/svg+xml"; l.href=f; } }
route();
